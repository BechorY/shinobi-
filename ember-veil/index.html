<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Ember Veil</title>
<style>
:root { --bg:#0b0710; --ui:#f4b062; }
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); touch-action:none; user-select:none; }
body { display:flex; align-items:center; justify-content:center; }
canvas { width:min(100vw, 177.78vh); height:auto; aspect-ratio:16/9; image-rendering:pixelated; image-rendering:crisp-edges; background:#000; }
#touch { display:none; position:fixed; inset:auto 0 12px 0; padding:0 16px; justify-content:space-between; pointer-events:none; }
#touch .grp { display:flex; gap:10px; pointer-events:auto; }
#touch button { width:64px; height:64px; border-radius:50%; border:2px solid rgba(244,176,98,.7); background:rgba(20,10,30,.55); color:var(--ui); font:700 14px monospace; touch-action:none; }
body.touch #touch { display:flex; }
</style>
</head>
<body>
<canvas id="c" width="800" height="450"></canvas>
<div id="touch">
  <div class="grp"><button data-k="ArrowLeft">&#9664;</button><button data-k="ArrowDown">&#9660;</button><button data-k="ArrowRight">&#9654;</button></div>
  <div class="grp"><button data-k="KeyC">FIRE</button><button data-k="KeyX">JUMP</button><button data-k="KeyZ">ATK</button></div>
</div>
<script>
'use strict';
// ============================================================
// EMBER VEIL — original ninja action side-scroller (Canvas 2D)
// Hero Kaede rescues captured apprentices in a Neo-Edo harbor.
// All art is drawn in code; audio is WebAudio synth.
// ============================================================
const W = 800, H = 450, GROUND = 390, WORLD = 3400, ARENA_X = 2600, GATE_X = 2540;
const GRAV = 1500, RUN_SPEED = 190, JUMP_V = -560, DT = 1 / 60;
const MELEE_RANGE_PX = 54, MAX_KUNAI = 3, START_LIVES = 3, MISSION_TIME_SEC = 180;
const INVULN_SEC = 2.5, DEATH_SEC = 1.2;

const params = new URLSearchParams(location.search);
const AUTO = params.has('auto');
const GOD = params.has('god') || AUTO;
const SPEED = Math.min(8, +params.get('speed') || 1);

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ---------- level data (one entry per mission) ----------
const PAL_DAY = {
  night: false, sky: ['#5fa6e4', '#d6ebf8'], tower: '#3f5fb5', towerWin: '#6a8fe0', towerEdge: '#2f4a96',
  wall: '#d8c49a', trim: '#efe3c4', shade: '#b89c6a', winA: '#8a6a3a', winB: '#5a7fb8',
  door: '#5a3a22', doorFrame: '#efe3c4', shutter: '#a87848', slat: '#7a5428', awn1: '#c0503a', awn2: '#f4f1e8',
  glass: '#2f3a4a', base: '#8a7048', paving: '#7c7468', paveLine: '#6a6256', grass: '#5b8a3a', grassDk: '#3f6a2a',
  slab: '#bfb59c', slabShade: '#8f866f', bracket: '#a89e86', rail: '#f4f1e8',
  crate: '#b0623a', crateEdge: '#6a3418', barrel: '#8a5a3a', barrelBand: '#4a2a18', lanterns: false,
};
const PAL_NIGHT = {
  night: true, sky: ['#0b0a2a', '#7a4a86'], tower: '#1c2a5a', towerWin: '#f6d060', towerEdge: '#121c40',
  wall: '#4a2a3a', trim: '#6a3c4c', shade: '#2e1a26', winLit: '#f0b050', winDark: '#2a1a2a',
  door: '#241418', doorFrame: '#6a3c4c', shutter: '#6a3a2a', slat: '#3a1e14', awn1: '#d8392f', awn2: '#f0e0b0',
  glass: '#1a1a2a', base: '#2e1a26', paving: '#3a3440', paveLine: '#2c2832', grass: '#2f4a38', grassDk: '#1f3226',
  slab: '#7a6a7a', slabShade: '#4e4250', bracket: '#5e5060', rail: '#d8c8c0',
  crate: '#8a4a30', crateEdge: '#4a2418', barrel: '#6a4430', barrelBand: '#2a160e', lanterns: true,
};
const STAGES = [
  { name: 'THE EMBER DOCKS', blurb: 'FIVE APPRENTICES ARE HELD ABOVE THE STREETS.', file: '0417',
    bossKind: 'crane', bossName: 'IRON CRANE', pal: PAL_DAY, marker: [486, 314],
    platforms: [{ x1: 380, x2: 720, y: 300 }, { x1: 960, x2: 1340, y: 300 }, { x1: 1560, x2: 1960, y: 300 }, { x1: 2080, x2: 2420, y: 300 }],
    hostages: [{ x: 560, y: 300 }, { x: 1120, y: 300 }, { x: 1250, y: GROUND }, { x: 1760, y: 300 }, { x: 2300, y: 300 }],
    spawns: [
      ['thug', 900], ['thug', 1020], ['scout', 1000, 300], ['thug', 1150], ['monk', 1300],
      ['leaper', 1420], ['scout', 1600, 300], ['thug', 1720], ['monk', 1880], ['leaper', 1980],
      ['thug', 2060], ['scout', 2150, 300], ['leaper', 2260], ['monk', 2400],
    ],
    checkpoints: [120, 1000, 1900] },
  { name: 'THE LANTERN MARKET', blurb: 'SIX MORE APPRENTICES ARE HIDDEN AMONG THE NIGHT STALLS.', file: '0522',
    bossKind: 'twins', bossName: 'TWIN MASKS', pal: PAL_NIGHT, marker: [330, 262],
    platforms: [{ x1: 300, x2: 640, y: 300 }, { x1: 820, x2: 1180, y: 300 }, { x1: 1260, x2: 1560, y: 300 },
      { x1: 1700, x2: 2080, y: 300 }, { x1: 2160, x2: 2460, y: 300 }],
    hostages: [{ x: 470, y: 300 }, { x: 1000, y: 300 }, { x: 1400, y: 300 }, { x: 1620, y: GROUND }, { x: 1890, y: 300 }, { x: 2320, y: 300 }],
    spawns: [
      ['thug', 880], ['scout', 900, 300], ['monk', 980], ['leaper', 1120], ['thug', 1200], ['monk', 1330],
      ['scout', 1350, 300], ['leaper', 1480], ['thug', 1600], ['monk', 1700], ['scout', 1800, 300],
      ['leaper', 1900], ['monk', 2000], ['thug', 2060], ['scout', 2250, 300], ['leaper', 2300], ['monk', 2420],
    ],
    checkpoints: [120, 900, 1700] },
];
let STAGE = 0, PLATFORMS, HOSTAGE_DEF, SPAWNS, CHECKPOINTS, PAL;
function applyStage(i) {
  STAGE = i; const st = STAGES[i];
  PLATFORMS = st.platforms; HOSTAGE_DEF = st.hostages; SPAWNS = st.spawns; CHECKPOINTS = st.checkpoints; PAL = st.pal;
}
applyStage(0);
const ET = {
  thug:   { hp: 1, w: 24, h: 44, score: 100 },
  scout:  { hp: 1, w: 24, h: 44, score: 200 },
  monk:   { hp: 2, w: 30, h: 46, score: 300 },
  leaper: { hp: 1, w: 24, h: 42, score: 250 },
};

// ---------- input ----------
const K = {}, P = {};
const held = (...c) => c.some(k => K[k]);
const press = (...c) => c.some(k => P[k]);
addEventListener('keydown', e => {
  if (!K[e.code]) P[e.code] = 1;
  K[e.code] = 1; initAudio();
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { K[e.code] = 0; });
if ('ontouchstart' in window || params.has('touch')) document.body.classList.add('touch');
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); initAudio(); if (!K[k]) P[k] = 1; K[k] = 1; };
  const up = e => { e.preventDefault(); K[k] = 0; };
  b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
});
cv.addEventListener('pointerdown', () => { initAudio(); if (mode !== 'play') P.Enter = 1; });

// ---------- audio ----------
let AC = null;
function initAudio() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { /* audio unavailable */ }
}
function tone(f, d, type = 'square', v = 0.05, slide = 0) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d);
}
const SFX = {
  jump: () => tone(300, .12, 'square', .04, 300), throw: () => tone(900, .08, 'triangle', .05, -500),
  slash: () => tone(500, .12, 'sawtooth', .05, -350), hit: () => tone(220, .1, 'square', .06, -100),
  block: () => tone(1200, .05, 'square', .04, -200), die: () => tone(400, .5, 'square', .07, -350),
  rescue: () => { tone(660, .1); setTimeout(() => tone(880, .15), 100); },
  magic: () => tone(120, .6, 'sawtooth', .08, 600), boom: () => tone(80, .4, 'sawtooth', .08, -40),
};
const sfx = n => { try { SFX[n](); } catch (e) { /* ignore */ } };

// ---------- state ----------
let mode = 'title';   // title | intro | play | stageclear | gameover | victory
let introPhase = 0, introT = 0;   // 0 mission card, 1 dossier, 2 player ready
const INTRO_DUR_SEC = [2.6, 3.4, 1.6];
let HI = 50000;
try { HI = +localStorage.getItem('ev_hi') || 50000; } catch (e) { /* storage unavailable */ }
let S = null;
const mkPlayer = x => ({ x, y: GROUND, vx: 0, vy: 0, face: 1, on: true, onPlat: false, crouch: false,
  atk: 0, thr: 0, cd: 0, inv: 0, drop: 0, dead: 0, anim: 0, run: false });
function stageState() {
  return { time: MISSION_TIME_SEC, camX: 0, shake: 0, p: mkPlayer(120), enemies: [], bolts: [], kunai: [], waves: [],
    fx: [], texts: [], hostages: HOSTAGE_DEF.map(h => ({ ...h, freed: false, ft: 0 })),
    spawnIdx: 0, magic: 1, ring: null, bosses: [], gateOpen: false, gateT: 0,
    bossLocked: false, rescued: 0, cp: CHECKPOINTS[0], bonus: 0, twinSwap: 0 };
}
function newGame() { applyStage(0); S = { t: 0, score: 0, lives: START_LIVES, ...stageState() }; }
function loadStage(i) { applyStage(i); S = { t: 0, score: S.score, lives: S.lives, ...stageState() }; }
function startGame() { newGame(); mode = 'intro'; introPhase = 0; introT = 0; }
newGame();
window.__g = { get S() { return S; }, get mode() { return mode; }, get phase() { return introPhase; }, get stage() { return STAGE; } };

// ---------- helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
function burst(x, y, color, n = 8, spd = 160) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, v = rand(.3, 1) * spd;
    S.fx.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: rand(.3, .7), c: color, s: rand(2, 5) });
  }
}
const floatText = (x, y, str, c = '#ffe9a8') => S.texts.push({ x, y, str, t: 0, c });
const onScreen = x => x > S.camX - 20 && x < S.camX + W + 20;

// ---------- player ----------
function hurtPlayer() {
  const p = S.p;
  if (GOD || p.inv > 0 || p.dead > 0) return;
  p.dead = DEATH_SEC; p.vy = -300; S.lives--; S.shake = .3; sfx('die');
  burst(p.x, p.y - 24, '#2a9aa3', 12);
}
function respawn() {
  const s = S, p = s.p;
  p.x = s.bossLocked ? ARENA_X + 60 : s.cp;
  Object.assign(p, { y: GROUND, vx: 0, vy: 0, on: true, dead: 0, inv: INVULN_SEC, crouch: false });
  s.bolts.length = 0; s.waves.length = 0;
  for (const e of s.enemies) if (Math.abs(e.x - p.x) < 380 && !e.dead) { e.dead = true; e.dt = .4; }
}
function dmgEnemy(e, d, fromKunai) {
  if (e.dead) return false;
  e.hp -= d; sfx('hit'); burst(e.x, e.y - e.h / 2, '#ffd27a', 6, 120);
  if (e.hp <= 0) {
    e.dead = true; e.dt = 0; S.score += ET[e.type].score;
    floatText(e.x, e.y - 50, '+' + ET[e.type].score);
  }
  return true;
}
function bossRect(b) { return { x1: b.x - b.w / 2, x2: b.x + b.w / 2, y1: b.y - b.h, y2: b.y }; }
function dmgBoss(b, d) {
  if (!b || b.dead || b.state === 'intro') return;
  b.hp -= d; b.flash = .1; sfx('hit'); burst(b.x, b.y - b.h * .6, '#ffd27a', 5, 140);
  if (b.hp <= 0) { b.hp = 0; b.dead = true; b.dt = 0; S.score += b.score; floatText(b.x, b.y - b.h - 10, '+' + b.score); sfx('boom'); }
}
function meleeHit() {
  const p = S.p, x1 = Math.min(p.x, p.x + p.face * MELEE_RANGE_PX), x2 = Math.max(p.x, p.x + p.face * MELEE_RANGE_PX);
  for (const e of S.enemies) {
    if (e.dead) continue;
    if (e.x + e.w / 2 > x1 && e.x - e.w / 2 < x2 && Math.abs(e.y - p.y) < 40) dmgEnemy(e, 2);
  }
  for (const b of S.bosses) {
    if (b.dead) continue;
    const r = bossRect(b); if (r.x2 > x1 && r.x1 < x2 && p.y > r.y1) dmgBoss(b, 2);
  }
}
function updatePlayer() {
  const s = S, p = s.p;
  p.anim += DT; p.cd -= DT; p.atk -= DT; p.thr -= DT; p.inv -= DT; p.drop -= DT;
  if (p.dead > 0) {
    p.dead -= DT; p.vy += GRAV * DT; p.y += p.vy * DT;
    if (p.dead <= 0) { if (s.lives <= 0) mode = 'gameover'; else respawn(); }
    return;
  }
  const L = held('ArrowLeft', 'KeyA'), R = held('ArrowRight', 'KeyD'), D = held('ArrowDown', 'KeyS');
  p.crouch = D && p.on;
  const ax = (R ? 1 : 0) - (L ? 1 : 0);
  p.vx = p.crouch ? 0 : ax * RUN_SPEED; p.run = !!ax && p.on;
  if (ax) p.face = ax;
  if (press('KeyX', 'KeyK', 'Space', 'ArrowUp') && p.on) {
    if (D && p.onPlat) { p.drop = .25; p.on = false; p.vy = 60; }
    else { p.vy = JUMP_V; p.on = false; sfx('jump'); }
  }
  const prevY = p.y;
  p.vy += GRAV * DT; p.y += p.vy * DT; p.x += p.vx * DT;
  const minX = s.bossLocked ? ARENA_X + 16 : 12;
  const maxX = s.gateOpen ? WORLD - 20 : GATE_X - 18;
  p.x = Math.max(minX, Math.min(maxX, p.x));
  p.on = false; p.onPlat = false;
  if (p.y >= GROUND) { p.y = GROUND; p.vy = 0; p.on = true; }
  else if (p.vy >= 0 && p.drop <= 0) {
    for (const pl of PLATFORMS) {
      if (p.x > pl.x1 && p.x < pl.x2 && prevY <= pl.y + .01 && p.y >= pl.y) { p.y = pl.y; p.vy = 0; p.on = true; p.onPlat = true; }
    }
  }
  // attack: melee when an enemy is in reach, otherwise throw a kunai
  if (press('KeyZ', 'KeyJ') && p.cd <= 0) {
    const reach = MELEE_RANGE_PX;
    let near = s.enemies.some(e => !e.dead && Math.sign(e.x - p.x) === p.face && Math.abs(e.x - p.x) < reach + e.w / 2 && Math.abs(e.y - p.y) < 40);
    if (s.bosses.some(b => !b.dead && Math.sign(b.x - p.x) === p.face && Math.abs(b.x - p.x) < reach + b.w / 2)) near = true;
    if (near) { p.atk = .22; p.cd = .3; meleeHit(); sfx('slash'); }
    else if (s.kunai.length < MAX_KUNAI) {
      p.thr = .15; p.cd = .28; sfx('throw');
      s.kunai.push({ x: p.x + p.face * 16, y: p.y - (p.crouch ? 14 : 30), vx: p.face * 560, life: 1 });
    }
  }
  if (press('KeyC', 'KeyL') && s.magic > 0 && !s.ring) {
    s.magic--; s.ring = { r: 0, x: p.x, y: p.y - 22, hit: new Set() }; s.shake = .4; sfx('magic');
  }
  for (let i = CHECKPOINTS.length - 1; i >= 0; i--) if (p.x > CHECKPOINTS[i]) { s.cp = Math.max(s.cp, CHECKPOINTS[i]); break; }
}

// ---------- enemies ----------
function spawnEnemy(def) {
  const [type, x, floor] = def, t = ET[type], fl = floor || GROUND;
  const e = { type, x, y: fl, floor: fl, vx: 0, vy: 0, hp: t.hp, w: t.w, h: t.h, face: -1, wind: 0,
    fire: 1, jt: 1 + Math.random(), dead: false, dt: 0, anim: Math.random() * 5, air: false };
  if (type === 'scout') {
    const pl = PLATFORMS.find(q => x > q.x1 && x < q.x2 && q.y === fl);
    e.x1 = pl ? pl.x1 + 20 : x - 100; e.x2 = pl ? pl.x2 - 20 : x + 100;
  }
  S.enemies.push(e);
}
function updateEnemy(e) {
  const p = S.p;
  e.anim += DT;
  if (e.dead) { e.dt += DT; return; }
  e.vy += GRAV * DT; e.y += e.vy * DT;
  if (e.y >= e.floor) { e.y = e.floor; e.vy = 0; if (e.air) { e.air = false; e.jt = rand(1.1, 2); } }
  const dx = p.x - e.x, d = Math.sign(dx) || e.face, adx = Math.abs(dx);
  const alive = p.dead <= 0;
  if (!e.air) e.face = d;
  const sameBand = Math.abs(p.y - e.y) < 36;
  if (e.type === 'thug' || e.type === 'monk') {
    const spd = e.type === 'thug' ? 90 : 55, windT = e.type === 'thug' ? .35 : .5;
    if (adx > 44) { e.x += d * spd * DT; e.wind = Math.min(e.wind, 0); }
    if (e.wind < 0) e.wind += DT;
    else if (adx <= 44) {
      e.wind += DT;
      if (e.wind > windT) { if (alive && adx < 50 && sameBand) hurtPlayer(); e.wind = -.6; }
    }
  } else if (e.type === 'scout') {
    if (adx < 200) e.x -= d * 60 * DT; else if (adx > 340) e.x += d * 60 * DT;
    e.x = Math.max(e.x1, Math.min(e.x2, e.x));
    e.fire -= DT;
    if (e.fire <= 0 && adx < 420 && onScreen(e.x) && alive) {
      const low = Math.random() < .5;
      S.bolts.push({ x: e.x + d * 20, y: e.y - (low ? 12 : 34), vx: d * 300, hh: 4, hw: 10 });
      e.fire = rand(1.6, 2.4); e.shoot = .2;
    }
    if (e.shoot) e.shoot = Math.max(0, e.shoot - DT);
  } else if (e.type === 'leaper') {
    if (!e.air) {
      if (adx > 60) e.x += d * 40 * DT;
      e.jt -= DT;
      if (e.jt <= 0 && adx < 330) { e.vy = -520; e.vx = d * 270; e.air = true; }
    } else e.x += e.vx * DT;
    if (alive && adx < 22 && Math.abs(p.y - e.y) < 40) hurtPlayer();
  }
  if (alive && (e.type === 'thug' || e.type === 'monk') && adx < 14 && sameBand) hurtPlayer();
}

// ---------- boss 1: Iron Crane ----------
function spawnCrane() {
  S.bosses = [{ kind: 'crane', score: 5000, x: ARENA_X + 650, y: GROUND, vx: 0, vy: 0, hp: 26, max: 26, w: 96, h: 120, face: -1,
    state: 'intro', t: 0, flash: 0, anim: 0, dead: false, dt: 0, air: false, last: '' }];
  S.bossLocked = true;
}
function setCrane(b, st) { b.state = st; b.t = 0; b.fired = false; b.jumped = false; }
function updateCrane(b) {
  const s = S, p = s.p;
  b.anim += DT; b.flash -= DT; b.t += DT;
  if (b.dead) {
    b.dt += DT;
    if (Math.random() < .5) burst(b.x + rand(-b.w / 2, b.w / 2), b.y - rand(0, b.h), Math.random() < .5 ? '#ff7a3a' : '#ffd27a', 4, 200);
    return;
  }
  const ph2 = b.hp <= b.max / 2, k = ph2 ? 1.35 : 1;
  b.vy += GRAV * DT; b.y += b.vy * DT;
  if (b.y >= GROUND) {
    b.y = GROUND; b.vy = 0;
    if (b.air) {
      b.air = false; s.shake = .35; sfx('boom');
      s.waves.push({ x: b.x - 40, vx: -300 * k, life: 2 }, { x: b.x + 40, vx: 300 * k, life: 2 });
      setCrane(b, 'idle'); b.t = -.2;
    }
  }
  const d = Math.sign(p.x - b.x) || b.face;
  switch (b.state) {
    case 'intro': if (b.t > 1.6) setCrane(b, 'idle'); break;
    case 'idle':
      b.face = d;
      if (b.t > .7 / k) {
        const opts = ['walk', 'hook', 'stomp'].filter(o => o !== b.last);
        b.last = opts[Math.floor(Math.random() * opts.length)]; setCrane(b, b.last);
      }
      break;
    case 'walk': b.face = d; b.x += d * 70 * k * DT; if (b.t > 1.8 / k) setCrane(b, 'idle'); break;
    case 'hook':
      b.face = d;
      if (!b.fired && b.t > .7) {
        b.fired = true; sfx('boom');
        s.bolts.push({ x: b.x + b.face * 60, y: GROUND - 40, vx: b.face * (ph2 ? 480 : 380), hh: 8, hw: 22, big: true });
      }
      if (b.t > 1.3) setCrane(b, 'idle');
      break;
    case 'stomp':
      if (!b.jumped && b.t > .5) { b.jumped = true; b.air = true; b.vy = -640; b.vx = Math.abs(p.x - b.x) > 150 ? d * 160 : 0; }
      if (b.jumped) b.x += b.vx * DT;
      break;
  }
  b.x = Math.max(ARENA_X + 60, Math.min(WORLD - 60, b.x));
  bossContact(b);
}
function bossContact(b) {
  const p = S.p;
  if (b.state === 'intro' || p.dead > 0) return;

  while (acc >= DT) { update(); acc -= DT; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
