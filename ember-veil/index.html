<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Ember Veil</title>
<style>
:root { --bg:#0b0710; --ui:#f4b062; }
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); touch-action:none; user-select:none; }
body { display:flex; align-items:center; justify-content:center; }
canvas { width:min(100vw, 177.78vh); height:auto; aspect-ratio:16/9; image-rendering:pixelated; image-rendering:crisp-edges; background:#000; }
#touch { display:none; position:fixed; inset:auto 0 12px 0; padding:0 16px; justify-content:space-between; pointer-events:none; }
#touch .grp { display:flex; gap:10px; pointer-events:auto; }
#touch button { width:64px; height:64px; border-radius:50%; border:2px solid rgba(244,176,98,.7); background:rgba(20,10,30,.55); color:var(--ui); font:700 14px monospace; touch-action:none; }
body.touch #touch { display:flex; }
</style>
</head>
<body>
<canvas id="c" width="800" height="450"></canvas>
<div id="touch">
  <div class="grp"><button data-k="ArrowLeft">&#9664;</button><button data-k="ArrowDown">&#9660;</button><button data-k="ArrowRight">&#9654;</button></div>
  <div class="grp"><button data-k="KeyC">FIRE</button><button data-k="KeyX">JUMP</button><button data-k="KeyZ">ATK</button></div>
</div>
<script>
'use strict';
// ============================================================
// EMBER VEIL — original ninja action side-scroller (Canvas 2D)
// Hero Kaede rescues captured apprentices in a Neo-Edo harbor.
// All art is drawn in code; audio is WebAudio synth.
// ============================================================
const W = 800, H = 450, GROUND = 390, WORLD = 3400, ARENA_X = 2600, GATE_X = 2540;
const GRAV = 1500, RUN_SPEED = 190, JUMP_V = -560, DT = 1 / 60;
const MELEE_RANGE_PX = 54, MAX_KUNAI = 3, START_LIVES = 3, MISSION_TIME_SEC = 180;
const INVULN_SEC = 2.5, DEATH_SEC = 1.2;

const params = new URLSearchParams(location.search);
const AUTO = params.has('auto');
const GOD = params.has('god') || AUTO;
const SPEED = Math.min(8, +params.get('speed') || 1);

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ---------- level data ----------
const PLATFORMS = [
  { x1: 380, x2: 720, y: 300 }, { x1: 960, x2: 1340, y: 300 },
  { x1: 1560, x2: 1960, y: 300 }, { x1: 2080, x2: 2420, y: 300 },
];
const HOSTAGE_DEF = [
  { x: 560, y: 300 }, { x: 1120, y: 300 }, { x: 1250, y: GROUND },
  { x: 1760, y: 300 }, { x: 2300, y: 300 },
];
const SPAWNS = [
  ['thug', 900], ['thug', 1020], ['scout', 1000, 300], ['thug', 1150], ['monk', 1300],
  ['leaper', 1420], ['scout', 1600, 300], ['thug', 1720], ['monk', 1880], ['leaper', 1980],
  ['thug', 2060], ['scout', 2150, 300], ['leaper', 2260], ['monk', 2400],
];
const CHECKPOINTS = [120, 1000, 1900];
const ET = {
  thug:   { hp: 1, w: 24, h: 44, score: 100 },
  scout:  { hp: 1, w: 24, h: 44, score: 200 },
  monk:   { hp: 2, w: 30, h: 46, score: 300 },
  leaper: { hp: 1, w: 24, h: 42, score: 250 },
};

// ---------- input ----------
const K = {}, P = {};
const held = (...c) => c.some(k => K[k]);
const press = (...c) => c.some(k => P[k]);
addEventListener('keydown', e => {
  if (!K[e.code]) P[e.code] = 1;
  K[e.code] = 1; initAudio();
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { K[e.code] = 0; });
if ('ontouchstart' in window || params.has('touch')) document.body.classList.add('touch');
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); initAudio(); if (!K[k]) P[k] = 1; K[k] = 1; };
  const up = e => { e.preventDefault(); K[k] = 0; };
  b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
});
cv.addEventListener('pointerdown', () => { initAudio(); if (mode !== 'play') P.Enter = 1; });

// ---------- audio ----------
let AC = null;
function initAudio() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { /* audio unavailable */ }
}
function tone(f, d, type = 'square', v = 0.05, slide = 0) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d);
}
const SFX = {
  jump: () => tone(300, .12, 'square', .04, 300), throw: () => tone(900, .08, 'triangle', .05, -500),
  slash: () => tone(500, .12, 'sawtooth', .05, -350), hit: () => tone(220, .1, 'square', .06, -100),
  block: () => tone(1200, .05, 'square', .04, -200), die: () => tone(400, .5, 'square', .07, -350),
  rescue: () => { tone(660, .1); setTimeout(() => tone(880, .15), 100); },
  magic: () => tone(120, .6, 'sawtooth', .08, 600), boom: () => tone(80, .4, 'sawtooth', .08, -40),
};
const sfx = n => { try { SFX[n](); } catch (e) { /* ignore */ } };

// ---------- state ----------
let mode = 'title';   // title | intro | play | gameover | victory
let introPhase = 0, introT = 0;   // 0 mission card, 1 dossier, 2 player ready
const INTRO_DUR_SEC = [2.6, 3.4, 1.6];
let HI = 50000;
try { HI = +localStorage.getItem('ev_hi') || 50000; } catch (e) { /* storage unavailable */ }
let S = null;
const mkPlayer = x => ({ x, y: GROUND, vx: 0, vy: 0, face: 1, on: true, onPlat: false, crouch: false,
  atk: 0, thr: 0, cd: 0, inv: 0, drop: 0, dead: 0, anim: 0, run: false });
function newGame() {
  S = { t: 0, score: 0, lives: START_LIVES, time: MISSION_TIME_SEC, camX: 0, shake: 0,
    p: mkPlayer(120), enemies: [], bolts: [], kunai: [], waves: [], fx: [], texts: [],
    hostages: HOSTAGE_DEF.map(h => ({ ...h, freed: false, ft: 0 })),
    spawnIdx: 0, magic: 1, ring: null, boss: null, gateOpen: false, gateT: 0,
    bossLocked: false, rescued: 0, cp: CHECKPOINTS[0], bonus: 0 };
}
function startGame() { newGame(); mode = 'intro'; introPhase = 0; introT = 0; }
newGame();
window.__g = { get S() { return S; }, get mode() { return mode; }, get phase() { return introPhase; } };

// ---------- helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
function burst(x, y, color, n = 8, spd = 160) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, v = rand(.3, 1) * spd;
    S.fx.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: rand(.3, .7), c: color, s: rand(2, 5) });
  }
}
const floatText = (x, y, str, c = '#ffe9a8') => S.texts.push({ x, y, str, t: 0, c });
const onScreen = x => x > S.camX - 20 && x < S.camX + W + 20;

// ---------- player ----------
function hurtPlayer() {
  const p = S.p;
  if (GOD || p.inv > 0 || p.dead > 0) return;
  p.dead = DEATH_SEC; p.vy = -300; S.lives--; S.shake = .3; sfx('die');
  burst(p.x, p.y - 24, '#2a9aa3', 12);
}
function respawn() {
  const s = S, p = s.p;
  p.x = s.bossLocked ? ARENA_X + 60 : s.cp;
  Object.assign(p, { y: GROUND, vx: 0, vy: 0, on: true, dead: 0, inv: INVULN_SEC, crouch: false });
  s.bolts.length = 0; s.waves.length = 0;
  for (const e of s.enemies) if (Math.abs(e.x - p.x) < 380 && !e.dead) { e.dead = true; e.dt = .4; }
}
function dmgEnemy(e, d, fromKunai) {
  if (e.dead) return false;
  e.hp -= d; sfx('hit'); burst(e.x, e.y - e.h / 2, '#ffd27a', 6, 120);
  if (e.hp <= 0) {
    e.dead = true; e.dt = 0; S.score += ET[e.type].score;
    floatText(e.x, e.y - 50, '+' + ET[e.type].score);
  }
  return true;
}
function bossRect(b) { return { x1: b.x - b.w / 2, x2: b.x + b.w / 2, y1: b.y - b.h, y2: b.y }; }
function dmgBoss(d) {
  const b = S.boss; if (!b || b.dead || b.state === 'intro') return;
  b.hp -= d; b.flash = .1; sfx('hit'); burst(b.x, b.y - 70, '#ffd27a', 5, 140);
  if (b.hp <= 0) { b.hp = 0; b.dead = true; b.dt = 0; S.score += 5000; floatText(b.x, b.y - 130, '+5000'); sfx('boom'); }
}
function meleeHit() {
  const p = S.p, x1 = Math.min(p.x, p.x + p.face * MELEE_RANGE_PX), x2 = Math.max(p.x, p.x + p.face * MELEE_RANGE_PX);
  for (const e of S.enemies) {
    if (e.dead) continue;
    if (e.x + e.w / 2 > x1 && e.x - e.w / 2 < x2 && Math.abs(e.y - p.y) < 40) dmgEnemy(e, 2);
  }
  const b = S.boss;
  if (b && !b.dead) { const r = bossRect(b); if (r.x2 > x1 && r.x1 < x2 && p.y > r.y1) dmgBoss(2); }
}
function updatePlayer() {
  const s = S, p = s.p;
  p.anim += DT; p.cd -= DT; p.atk -= DT; p.thr -= DT; p.inv -= DT; p.drop -= DT;
  if (p.dead > 0) {
    p.dead -= DT; p.vy += GRAV * DT; p.y += p.vy * DT;
    if (p.dead <= 0) { if (s.lives <= 0) mode = 'gameover'; else respawn(); }
    return;
  }
  const L = held('ArrowLeft', 'KeyA'), R = held('ArrowRight', 'KeyD'), D = held('ArrowDown', 'KeyS');
  p.crouch = D && p.on;
  const ax = (R ? 1 : 0) - (L ? 1 : 0);
  p.vx = p.crouch ? 0 : ax * RUN_SPEED; p.run = !!ax && p.on;
  if (ax) p.face = ax;
  if (press('KeyX', 'KeyK', 'Space', 'ArrowUp') && p.on) {
    if (D && p.onPlat) { p.drop = .25; p.on = false; p.vy = 60; }
    else { p.vy = JUMP_V; p.on = false; sfx('jump'); }
  }
  const prevY = p.y;
  p.vy += GRAV * DT; p.y += p.vy * DT; p.x += p.vx * DT;
  const minX = s.bossLocked ? ARENA_X + 16 : 12;
  const maxX = s.gateOpen ? WORLD - 20 : GATE_X - 18;
  p.x = Math.max(minX, Math.min(maxX, p.x));
  p.on = false; p.onPlat = false;
  if (p.y >= GROUND) { p.y = GROUND; p.vy = 0; p.on = true; }
  else if (p.vy >= 0 && p.drop <= 0) {
    for (const pl of PLATFORMS) {
      if (p.x > pl.x1 && p.x < pl.x2 && prevY <= pl.y + .01 && p.y >= pl.y) { p.y = pl.y; p.vy = 0; p.on = true; p.onPlat = true; }
    }
  }
  // attack: melee when an enemy is in reach, otherwise throw a kunai
  if (press('KeyZ', 'KeyJ') && p.cd <= 0) {
    const reach = MELEE_RANGE_PX;
    let near = s.enemies.some(e => !e.dead && Math.sign(e.x - p.x) === p.face && Math.abs(e.x - p.x) < reach + e.w / 2 && Math.abs(e.y - p.y) < 40);
    const b = s.boss;
    if (b && !b.dead && Math.sign(b.x - p.x) === p.face && Math.abs(b.x - p.x) < reach + b.w / 2) near = true;
    if (near) { p.atk = .22; p.cd = .3; meleeHit(); sfx('slash'); }
    else if (s.kunai.length < MAX_KUNAI) {
      p.thr = .15; p.cd = .28; sfx('throw');
      s.kunai.push({ x: p.x + p.face * 16, y: p.y - (p.crouch ? 14 : 30), vx: p.face * 560, life: 1 });
    }
  }
  if (press('KeyC', 'KeyL') && s.magic > 0 && !s.ring) {
    s.magic--; s.ring = { r: 0, x: p.x, y: p.y - 22, hitBoss: false }; s.shake = .4; sfx('magic');
  }
  for (let i = CHECKPOINTS.length - 1; i >= 0; i--) if (p.x > CHECKPOINTS[i]) { s.cp = Math.max(s.cp, CHECKPOINTS[i]); break; }
}

// ---------- enemies ----------
function spawnEnemy(def) {
  const [type, x, floor] = def, t = ET[type], fl = floor || GROUND;
  const e = { type, x, y: fl, floor: fl, vx: 0, vy: 0, hp: t.hp, w: t.w, h: t.h, face: -1, wind: 0,
    fire: 1, jt: 1 + Math.random(), dead: false, dt: 0, anim: Math.random() * 5, air: false };
  if (type === 'scout') {
    const pl = PLATFORMS.find(q => x > q.x1 && x < q.x2 && q.y === fl);
    e.x1 = pl ? pl.x1 + 20 : x - 100; e.x2 = pl ? pl.x2 - 20 : x + 100;
  }
  S.enemies.push(e);
}
function updateEnemy(e) {
  const p = S.p;
  e.anim += DT;
  if (e.dead) { e.dt += DT; return; }
  e.vy += GRAV * DT; e.y += e.vy * DT;
  if (e.y >= e.floor) { e.y = e.floor; e.vy = 0; if (e.air) { e.air = false; e.jt = rand(1.1, 2); } }
  const dx = p.x - e.x, d = Math.sign(dx) || e.face, adx = Math.abs(dx);
  const alive = p.dead <= 0;
  if (!e.air) e.face = d;
  const sameBand = Math.abs(p.y - e.y) < 36;
  if (e.type === 'thug' || e.type === 'monk') {
    const spd = e.type === 'thug' ? 90 : 55, windT = e.type === 'thug' ? .35 : .5;
    if (adx > 44) { e.x += d * spd * DT; e.wind = Math.min(e.wind, 0); }
    if (e.wind < 0) e.wind += DT;
    else if (adx <= 44) {
      e.wind += DT;
      if (e.wind > windT) { if (alive && adx < 50 && sameBand) hurtPlayer(); e.wind = -.6; }
    }
  } else if (e.type === 'scout') {
    if (adx < 200) e.x -= d * 60 * DT; else if (adx > 340) e.x += d * 60 * DT;
    e.x = Math.max(e.x1, Math.min(e.x2, e.x));
    e.fire -= DT;
    if (e.fire <= 0 && adx < 420 && onScreen(e.x) && alive) {
      const low = Math.random() < .5;
      S.bolts.push({ x: e.x + d * 20, y: e.y - (low ? 12 : 34), vx: d * 300, hh: 4, hw: 10 });
      e.fire = rand(1.6, 2.4); e.shoot = .2;
    }
    if (e.shoot) e.shoot = Math.max(0, e.shoot - DT);
  } else if (e.type === 'leaper') {
    if (!e.air) {
      if (adx > 60) e.x += d * 40 * DT;
      e.jt -= DT;
      if (e.jt <= 0 && adx < 330) { e.vy = -520; e.vx = d * 270; e.air = true; }
    } else e.x += e.vx * DT;
    if (alive && adx < 22 && Math.abs(p.y - e.y) < 40) hurtPlayer();
  }
  if (alive && (e.type === 'thug' || e.type === 'monk') && adx < 14 && sameBand) hurtPlayer();
}

// ---------- boss: Iron Crane ----------
function spawnBoss() {
  S.boss = { x: ARENA_X + 650, y: GROUND, vx: 0, vy: 0, hp: 26, max: 26, w: 96, h: 120, face: -1,
    state: 'intro', t: 0, flash: 0, anim: 0, dead: false, dt: 0, air: false, last: '' };
  S.bossLocked = true;
}
function setBoss(st) { const b = S.boss; b.state = st; b.t = 0; b.fired = false; b.jumped = false; }
function updateBoss(b) {
  const s = S, p = s.p;
  b.anim += DT; b.flash -= DT; b.t += DT;
  if (b.dead) {
    b.dt += DT;
    if (Math.random() < .5) burst(b.x + rand(-b.w / 2, b.w / 2), b.y - rand(0, b.h), Math.random() < .5 ? '#ff7a3a' : '#ffd27a', 4, 200);
    if (b.dt > 2.4 && mode === 'play') {
      s.bonus = Math.floor(s.time) * 10; s.score += s.bonus; mode = 'victory'; s.t = 0;
    }
    return;
  }
  const ph2 = b.hp <= b.max / 2, k = ph2 ? 1.35 : 1;
  b.vy += GRAV * DT; b.y += b.vy * DT;
  if (b.y >= GROUND) {
    b.y = GROUND; b.vy = 0;
    if (b.air) {
      b.air = false; s.shake = .35; sfx('boom');
      s.waves.push({ x: b.x - 40, vx: -300 * k, life: 2 }, { x: b.x + 40, vx: 300 * k, life: 2 });
      setBoss('idle'); b.t = -.2;
    }
  }
  const d = Math.sign(p.x - b.x) || b.face;
  switch (b.state) {
    case 'intro': if (b.t > 1.6) setBoss('idle'); break;
    case 'idle':
      b.face = d;
      if (b.t > .7 / k) {
        const opts = ['walk', 'hook', 'stomp'].filter(o => o !== b.last);
        b.last = opts[Math.floor(Math.random() * opts.length)]; setBoss(b.last);
      }
      break;
    case 'walk': b.face = d; b.x += d * 70 * k * DT; if (b.t > 1.8 / k) setBoss('idle'); break;
    case 'hook':
      b.face = d;
      if (!b.fired && b.t > .7) {
        b.fired = true; sfx('boom');
        s.bolts.push({ x: b.x + b.face * 60, y: GROUND - 40, vx: b.face * (ph2 ? 480 : 380), hh: 8, hw: 22, big: true });
      }
      if (b.t > 1.3) setBoss('idle');
      break;
    case 'stomp':
      if (!b.jumped && b.t > .5) { b.jumped = true; b.air = true; b.vy = -640; b.vx = Math.abs(p.x - b.x) > 150 ? d * 160 : 0; }
      if (b.jumped) b.x += b.vx * DT;
      break;
  }
  b.x = Math.max(ARENA_X + 60, Math.min(WORLD - 60, b.x));
  if (b.state !== 'intro' && p.dead <= 0) {
    const r = bossRect(b);
    if (p.x > r.x1 - 8 && p.x < r.x2 + 8 && p.y > r.y1 && p.y - 44 < r.y2) hurtPlayer();
  }
}

// ---------- world update ----------
function updatePlay() {
  const s = S, p = s.p;
  s.t += DT;
  if (!(s.boss && s.boss.dead)) s.time -= DT;
  if (s.time <= 0) { s.time = 0; mode = 'gameover'; return; }
  updatePlayer();
  if (s.score > HI) HI = s.score;
  if (mode !== 'play') return;
  // spawns
  while (s.spawnIdx < SPAWNS.length && SPAWNS[s.spawnIdx][1] < s.camX + W + 40) spawnEnemy(SPAWNS[s.spawnIdx++]);
  for (const e of s.enemies) updateEnemy(e);
  s.enemies = s.enemies.filter(e => !(e.dead && e.dt > .5) && e.x > s.camX - 320);
  // hostages
  for (const h of s.hostages) {
    if (h.freed) { h.ft += DT; if (h.ft > .5) h.x -= 90 * DT; continue; }
    if (p.dead <= 0 && Math.abs(p.x - h.x) < 22 && Math.abs(p.y - h.y) < 30) {
      h.freed = true; s.rescued++; s.score += 500; sfx('rescue');
      floatText(h.x, h.y - 60, '+500 RESCUED'); burst(h.x, h.y - 24, '#ffffff', 10, 140);
      if (s.rescued === HOSTAGE_DEF.length) { s.gateOpen = true; floatText(GATE_X, 250, 'GATE OPEN', '#7be0a0'); sfx('magic'); }
    }
  }
  if (s.gateOpen) s.gateT = Math.min(1, s.gateT + DT * 1.2);
  // kunai
  for (const k of s.kunai) {
    k.x += k.vx * DT; k.life -= DT;
    for (const e of s.enemies) {
      if (e.dead || k.life <= 0) continue;
      if (Math.abs(k.x - e.x) < e.w / 2 + 6 && k.y > e.y - e.h && k.y < e.y) {
        if (e.type === 'monk' && Math.sign(k.x - e.x) === e.face) { k.life = 0; sfx('block'); burst(k.x, k.y, '#ffffff', 4, 90); floatText(e.x, e.y - 56, 'BLOCKED', '#cfd8e8'); }
        else { dmgEnemy(e, 1); k.life = 0; }
      }
    }
    const b = s.boss;
    if (b && !b.dead && k.life > 0) { const r = bossRect(b); if (k.x > r.x1 && k.x < r.x2 && k.y > r.y1 && k.y < r.y2) { dmgBoss(1); k.life = 0; } }
    if (k.x < s.camX - 40 || k.x > s.camX + W + 40) k.life = 0;
  }
  s.kunai = s.kunai.filter(k => k.life > 0);
  // enemy projectiles
  for (const b of s.bolts) {
    b.x += b.vx * DT;
    if (p.dead <= 0 && Math.abs(b.x - p.x) < (b.hw || 10)) {
      const top = p.y - (p.crouch ? 26 : 44);
      if (b.y - b.hh < p.y && b.y + b.hh > top) { hurtPlayer(); if (!b.big) b.x = -9999; }
    }
  }
  s.bolts = s.bolts.filter(b => b.x > s.camX - 80 && b.x < s.camX + W + 80);
  for (const w of s.waves) {
    w.x += w.vx * DT; w.life -= DT;
    if (p.dead <= 0 && Math.abs(w.x - p.x) < 14 && p.y >= GROUND - 12) hurtPlayer();
  }
  s.waves = s.waves.filter(w => w.life > 0);
  // magic ring
  if (s.ring) {
    const r = s.ring; r.r += 900 * DT;

    ctx.fillStyle = '#8f9bab'; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(244, 80 + i * 130, 6, 0, 6.283); ctx.fill(); }
    ctx.save(); ctx.beginPath(); ctx.rect(262, 44, 110, 120); ctx.clip();
    ctx.fillStyle = '#2a2d38'; ctx.fillRect(262, 44, 110, 120);
    ctx.translate(318, 156); ctx.scale(.62, .62);
    drawBoss({ x: 0, y: 0, face: 1, hp: 26, max: 26, flash: 0, anim: 0, state: 'idle', t: 0, dead: false });
    ctx.restore();
    txt('File No. 0417', 392, 64, 16, '#2a2d38', 'left', false);
    txt('IRON CRANE', 392, 92, 20, '#8a2f1c', 'left', false);
    ctx.fillStyle = '#9aa3b0';
    for (let i = 0; i < 4; i++) ctx.fillRect(392, 108 + i * 14, 150 - (i % 2) * 40, 4);
    ctx.fillStyle = '#c9d8c9'; ctx.fillRect(262, 190, 280, 200);
    ctx.fillStyle = '#8fb8e0'; ctx.fillRect(262, 190, 280, 38);
    ctx.fillStyle = '#ffffff';
    for (let x = 290; x < 542; x += 52) ctx.fillRect(x, 228, 5, 162);
    for (let y = 262; y < 390; y += 42) ctx.fillRect(262, y, 280, 5);
    ctx.fillStyle = '#b8c8a0'; ctx.fillRect(300, 240, 40, 16); ctx.fillRect(420, 300, 60, 24); ctx.fillRect(344, 330, 40, 30);
    ctx.fillStyle = '#d8392f'; ctx.beginPath(); ctx.arc(486, 314, 7, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#d8392f'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(486, 314, 14, 0, 6.283); ctx.stroke();
    ctx.fillStyle = '#2a9aa3'; ctx.fillRect(278, 372, 8, 8);
    txt('TARGET', 410, 345, 11, '#8a2f1c', 'left', false);
  }
  ctx.globalAlpha = 1;
}
function render() {
  if (mode === 'intro' && introPhase < 2) { drawIntro(); return; }
  const s = S, t = s.t;
  const cx = s.camX + (s.shake > 0 ? rand(-4, 4) : 0), cy = s.shake > 0 ? rand(-3, 3) : 0;
  ctx.save(); ctx.translate(0, cy);
  drawBackground(cx, t); drawGround(cx); drawPlatforms(cx); drawGate(cx);
  ctx.save(); ctx.translate(-Math.round(cx), 0);
  for (const h of s.hostages) drawHostage(h, cx, t);
  for (const e of s.enemies) drawEnemy(e);
  if (s.boss) drawBoss(s.boss);
  const p = s.p;
  if (!(p.inv > 0 && p.dead <= 0 && Math.floor(t * 20) % 2)) drawHero(p.x, p.y, p.face, p);
  for (const k of s.kunai) { ctx.fillStyle = '#e8eef2'; ctx.fillRect(k.x - 8, k.y - 2, 16, 4); ctx.fillStyle = '#ffd27a'; ctx.fillRect(k.x + (k.vx > 0 ? 4 : -8), k.y - 2, 4, 4); }
  for (const b of s.bolts) {
    if (b.big) { ctx.fillStyle = '#8a8f9e'; ctx.fillRect(b.x - 24, b.y - 4, 40, 8); ctx.fillStyle = '#c9c1b4'; ctx.fillRect(b.x + (b.vx > 0 ? 10 : -26), b.y - 10, 16, 20); }
    else { ctx.fillStyle = '#ffb04a'; ctx.fillRect(b.x - 9, b.y - 2, 18, 4); }
  }
  for (const w of s.waves) { ctx.fillStyle = '#ff8a3a'; ctx.beginPath(); ctx.moveTo(w.x - 10, GROUND); ctx.lineTo(w.x, GROUND - 22); ctx.lineTo(w.x + 10, GROUND); ctx.fill(); ctx.fillStyle = '#ffe9a8'; ctx.fillRect(w.x - 4, GROUND - 8, 8, 8); }
  for (const f of s.fx) { ctx.fillStyle = f.c; ctx.fillRect(f.x, f.y, f.s, f.s); }
  if (s.ring) {
    const r = s.ring, g = ctx.createRadialGradient(r.x, r.y, Math.max(1, r.r - 40), r.x, r.y, r.r + 6);
    g.addColorStop(0, 'rgba(255,120,40,0)'); g.addColorStop(.8, 'rgba(255,170,70,.65)'); g.addColorStop(1, 'rgba(255,240,180,.9)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(r.x, r.y, r.r + 6, 0, 6.283); ctx.fill();
  }
  for (const tx of s.texts) txt(tx.str, tx.x, tx.y - tx.t * 40, 14, tx.c, 'center');
  ctx.restore();
  ctx.restore();
  // vignette
  const v = ctx.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 480);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  if (mode === 'play') drawHUD();
  else if (mode === 'intro') { drawHUD(); if (Math.floor(s.t * 4) % 2 === 0) txt('PLAYER 1 READY', W / 2, 190, 26, '#ffffff', 'center'); }
  else if (mode === 'title') drawTitle();
  else drawEnd();
}
function drawTitle() {
  const s = S;
  ctx.fillStyle = 'rgba(8,4,16,.5)'; ctx.fillRect(0, 0, W, H);
  txt('EMBER VEIL', W / 2, 150, 64, '#ff8a3a', 'center');
  txt('A NINJA ACTION GAME', W / 2, 184, 18, '#ffe9a8', 'center');
  if (Math.floor(s.t * 2) % 2 === 0) txt('PRESS ENTER OR TAP TO START', W / 2, 270, 20, '#ffffff', 'center');
  txt('ARROWS / WASD  MOVE  (DOWN = CROUCH)', W / 2, 330, 13, '#cfd8e8', 'center');
  txt('X / SPACE  JUMP  (DOWN+JUMP DROPS A FLOOR)', W / 2, 350, 13, '#cfd8e8', 'center');
  txt('Z  ATTACK: SLASH UP CLOSE, KUNAI AT RANGE', W / 2, 370, 13, '#cfd8e8', 'center');
  txt('C  EMBER BLOOM (ONCE PER STAGE)', W / 2, 390, 13, '#cfd8e8', 'center');
  txt('RESCUE ALL 5 APPRENTICES, THEN FACE THE IRON CRANE', W / 2, 420, 13, '#ffd27a', 'center');
}
function drawEnd() {
  const s = S, won = mode === 'victory';
  ctx.fillStyle = 'rgba(8,4,16,.65)'; ctx.fillRect(0, 0, W, H);
  txt(won ? 'STAGE CLEAR' : 'GAME OVER', W / 2, 170, 56, won ? '#7be0a0' : '#ff5a3a', 'center');
  txt('SCORE ' + s.score, W / 2, 220, 24, '#ffe9a8', 'center');
  if (won) txt(`RESCUED ${s.rescued}/${HOSTAGE_DEF.length}   TIME BONUS ${s.bonus}`, W / 2, 252, 16, '#cfd8e8', 'center');
  if (Math.floor(s.t * 2) % 2 === 0) txt('PRESS ENTER OR TAP TO PLAY AGAIN', W / 2, 320, 18, '#ffffff', 'center');
}

// ---------- main loop ----------
function update() {
  if (AUTO) autopilot();
  if (mode === 'title') { S.t += DT; if (press('Enter')) startGame(); }
  else if (mode === 'intro') {
    S.t += DT; introT += DT;
    if (press('Enter', 'Space', 'KeyZ') || introT >= INTRO_DUR_SEC[introPhase]) { introPhase++; introT = 0; if (introPhase > 2) mode = 'play'; }
  }
  else if (mode === 'play') updatePlay();
  else { S.t += DT; if (press('Enter')) startGame(); }
  if ((mode === 'gameover' || mode === 'victory') && !S.hiSaved) {
    S.hiSaved = 1; HI = Math.max(HI, S.score);
    try { localStorage.setItem('ev_hi', String(HI)); } catch (e) { /* ignore */ }
  }
  for (const k in P) delete P[k];
}
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(.1, (now - last) / 1000) * SPEED; last = now;
  while (acc >= DT) { update(); acc -= DT; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
