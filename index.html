// ============================================================
// BOOT SCENE — generate textures
// ============================================================
class BootScene extends Phaser.Scene {
  constructor() { super('Boot'); }

  create() {
    this.generateTextures();
    this.scene.start('Game');
  }

  generateTextures() {
    // --- PLAYER: Joe Musashi ninja (28x44, 16-bit pixel art) ---
    this.drawPixelArt('player', 28, 44, this.playerPixels());
    this.drawPixelArt('player_attack', 40, 44, this.playerAttackPixels());

    // --- HOSTAGE: tied-up civilian ---
    this.drawPixelArt('hostage', 20, 36, this.hostagePixels());

    // --- ENEMIES ---
    this.drawPixelArt('enemy_ninja_runner', 28, 40, this.ninjaRunnerPixels());
    this.drawPixelArt('enemy_shuriken', 24, 36, this.shurikenThrowerPixels());
    this.drawPixelArt('enemy_samurai', 32, 44, this.samuraiPixels());
    this.drawPixelArt('enemy_jumper', 26, 38, this.jumperPixels());
    this.drawPixelArt('enemy_boss_minion', 30, 42, this.bossMinionPixels());
    this.drawPixelArt('enemy_mini_boss', 48, 56, this.miniBossPixels());
    this.drawPixelArt('enemy_final_boss', 56, 64, this.finalBossPixels());

    // --- PROJECTILE: spinning shuriken star ---
    this.drawPixelArt('shuriken_proj', 10, 10, this.shurikenProjPixels());

    // --- HIT EFFECT ---
    this.drawHitEffect();

    // --- HUD ICONS ---
    this.drawPixelArt('hostage_icon', 12, 16, this.hostageIconPixels());
    this.drawPixelArt('hostage_icon_empty', 12, 16, this.hostageIconEmptyPixels());

    // --- GROUND TILE ---
    this.drawGroundTile();

    // --- PLATFORM TILE ---
    this.drawPlatformTile();

    // --- TOUCH CONTROLS ---
    this.makeCircle('dpad_base', 60, 0x333333, 0.4);
    this.makeCircle('dpad_knob', 24, 0x888888, 0.7);
    this.drawTouchButton('btn_attack', 28, 0xCC3333, 'A');
    this.drawTouchButton('btn_jump', 28, 0x3333CC, 'J');
  }

  // === PIXEL ART RENDERER ===
  drawPixelArt(key, w, h, pixelData) {
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    for (const px of pixelData) {
      ctx.fillStyle = px.c;
      ctx.fillRect(px.x, px.y, px.w || 1, px.h || 1);
    }

    this.textures.addCanvas(key, canvas);
  }

  // Helper: fill a rectangle area with pixels
  pxRect(x, y, w, h, color) {
    const pixels = [];
    for (let py = y; py < y + h; py++) {
      for (let px = x; px < x + w; px++) {
        pixels.push({ x: px, y: py, c: color });
      }
    }
    return pixels;
  }

  // === PLAYER SPRITE: Joe Musashi (1987 Arcade — white ninja suit) ===

    const p = [];
    const skin = '#E8C090';

    const suitDk = '#C8C0B0';     // suit shadow

    const belt = '#CC2222';       // red belt/sash

    const eye = '#FFFFFF';
    const headband = '#CC2222';   // red headband
    const boot = '#8B4513';       // brown tabi boots
    const outline = '#111111';

    // Head (centered at x=10..18, y=0..10)
    p.push(...this.pxRect(11, 0, 6, 2, hair));       // hair top
    p.push(...this.pxRect(10, 2, 8, 2, hair));       // hair
    p.push(...this.pxRect(10, 4, 8, 1, headband));   // red headband
    p.push(...this.pxRect(10, 5, 8, 5, skin));       // face
    p.push(...this.pxRect(12, 6, 2, 1, eye));        // left eye

    p.push(...this.pxRect(12, 6, 1, 1, '#333'));      // pupil L
    p.push(...this.pxRect(16, 6, 1, 1, '#333'));      // pupil R
    p.push(...this.pxRect(13, 8, 2, 1, skin));       // mouth area
    // White mask/scarf

    // Torso (x=8..20, y=11..24)

    p.push(...this.pxRect(8, 13, 12, 6, suit));       // chest
    p.push(...this.pxRect(10, 13, 8, 6, suitLt));     // chest highlight
    p.push(...this.pxRect(8, 19, 12, 2, belt));       // red belt/sash
    p.push(...this.pxRect(8, 21, 12, 4, suit));       // waist

    p.push(...this.pxRect(20, 12, 3, 8, suit));       // right arm
    p.push(...this.pxRect(20, 20, 3, 2, skin));       // right hand

    // Legs (y=25..38) — white pants

    p.push(...this.pxRect(14, 36, 6, 2, '#6B3A10'));   // right sole

    return p;
  }

  // === GROUND TILE (arcade-style stone/concrete) ===
  drawGroundTile() {
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 48;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    // Base stone/concrete
    ctx.fillStyle = '#888888';
    ctx.fillRect(0, 0, 64, 48);
    // Top edge highlight
    ctx.fillStyle = '#999999';
    ctx.fillRect(0, 0, 64, 2);
    ctx.fillStyle = '#AAAAAA';
    ctx.fillRect(0, 0, 64, 1);
    // Brick/stone pattern
    ctx.fillStyle = '#777777';
    ctx.fillRect(0, 3, 64, 1);      // mortar line
    ctx.fillRect(0, 12, 64, 1);
    ctx.fillRect(0, 21, 64, 1);
    ctx.fillRect(0, 30, 64, 1);
    ctx.fillRect(0, 39, 64, 1);
    // Vertical mortar lines (offset pattern)
    ctx.fillStyle = '#777777';
    for (let row = 0; row < 5; row++) {
      const yOff = row * 9 + 3;
      const xOff = (row % 2) * 16;
      for (let x = xOff; x < 64; x += 32) {
        ctx.fillRect(x, yOff, 1, 9);
      }
    }
    // Stone texture variation
    ctx.fillStyle = '#7A7A7A';
    for (let i = 0; i < 8; i++) {
      const sx = Math.floor(Math.random() * 58);
      const sy = 4 + Math.floor(Math.random() * 40);
      ctx.fillRect(sx, sy, 3 + Math.floor(Math.random() * 4), 2);
    }
    // Dark bottom edge
    ctx.fillStyle = '#666666';
    ctx.fillRect(0, 46, 64, 2);

    this.textures.addCanvas('ground', canvas);
  }

  // === PLATFORM TILE (reuses ground key but let's add visual variety in game scene) ===
  drawPlatformTile() {
    // Platforms use same ground texture, handled in addPlatform
  }

  // === TOUCH BUTTON ===
  drawTouchButton(key, r, color, label) {
    const canvas = document.createElement('canvas');
    canvas.width = r * 2;
    canvas.height = r * 2;
    const ctx = canvas.getContext('2d');
    // Outer circle
    ctx.beginPath();
    ctx.arc(r, r, r - 1, 0, Math.PI * 2);
    const hex = '#' + color.toString(16).padStart(6, '0');
    ctx.fillStyle = hex;
    ctx.globalAlpha = 0.6;
    ctx.fill();
    // Inner highlight
    ctx.beginPath();
    ctx.arc(r, r - 2, r * 0.6, 0, Math.PI * 2);
    ctx.fillStyle = '#FFFFFF';
    ctx.globalAlpha = 0.15;
    ctx.fill();
    // Label
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, r, r + 1);
    this.textures.addCanvas(key, canvas);
  }

  makeCircle(key, r, color, alpha) {
    const canvas = document.createElement('canvas');
    canvas.width = r * 2;
    canvas.height = r * 2;
    const ctx = canvas.getContext('2d');
    ctx.beginPath();
    ctx.arc(r, r, r - 1, 0, Math.PI * 2);
    const hex = '#' + color.toString(16).padStart(6, '0');
    ctx.fillStyle = hex;
    ctx.globalAlpha = alpha;
    ctx.fill();
    this.textures.addCanvas(key, canvas);
  }
}

// ============================================================
// GAME SCENE — main gameplay
// ============================================================
class GameScene extends Phaser.Scene {
  constructor() { super('Game'); }

  create() {
    // State
    this.score = 0;
    this.hiScore = parseInt(localStorage.getItem('shinobi_hi') || '0');
    this.lives = 3;
    this.hostagesTotal = 5;
    this.hostagesRescued = 0;
    this.missionTime = MISSION_TIME;
    this.gameOver = false;
    this.gameWon = false;
    this.lastAttackTime = 0;
    this.spawnIndex = 0;
    this.elapsed = 0;
    this.cameraOffsetX = 0;
    this.playerFacing = 1; // 1=right, -1=left
    this.isMobile = this.checkMobile();

    // World bounds (wide scrolling level)
    const WORLD_W = 4000;
    this.physics.world.setBounds(0, 0, WORLD_W, GAME_H);
    this.cameras.main.setBounds(0, 0, WORLD_W, GAME_H);

    // --- Parallax backgrounds (detailed pixel art) ---
    this.bgLayers = [];
    const totalW = WORLD_W + GAME_W;

    // Layer 0: Night sky (arcade dark blue)
    const sky = this.add.graphics();
    sky.fillStyle(0x0a0a2a, 1);
    sky.fillRect(0, 0, totalW, GAME_H);
    // Gradient sky (deep blue to slightly lighter)
    sky.fillStyle(0x0a0a2a, 1); sky.fillRect(0, 0, totalW, 40);
    sky.fillStyle(0x101040, 1); sky.fillRect(0, 40, totalW, 20);
    sky.fillStyle(0x151550, 1); sky.fillRect(0, 60, totalW, 20);
    sky.fillStyle(0x1a1a5a, 1); sky.fillRect(0, 80, totalW, GAME_H - 80);
    // Stars
    sky.fillStyle(0xFFFFFF, 0.8);
    for (let i = 0; i < 80; i++) {
      const sx = Math.random() * totalW;
      const sy = Math.random() * 100;
      const ss = Math.random() > 0.8 ? 2 : 1;
      sky.fillRect(sx, sy, ss, ss);
    }
    // Moon
    sky.fillStyle(0xFFEECC, 0.9);
    sky.fillCircle(200, 35, 18);
    sky.fillStyle(0xFFDD99, 0.6);
    sky.fillCircle(196, 32, 14);
    sky.fillStyle(0x1a1a3e, 0.8);
    sky.fillCircle(190, 30, 12); // crescent shadow
    sky.setScrollFactor(0.05, 1);
    this.bgLayers.push({ graphics: sky });

    // Layer 1: Distant city buildings silhouette (arcade — dark blue)
    const dist = this.add.graphics();
    dist.fillStyle(0x111133, 1);
    dist.fillRect(0, 80, totalW, 100);
    // Building silhouettes (darker)
    for (let x = 0; x < totalW; x += 40 + Math.floor(Math.random() * 60)) {
      const bw = 25 + Math.floor(Math.random() * 40);
      const bh = 40 + Math.floor(Math.random() * 60);
      dist.fillStyle(0x0a0a22, 1);
      dist.fillRect(x, 180 - bh, bw, bh);
      // Lit windows (yellow dots like arcade)
      dist.fillStyle(0xFFDD44, 0.7);
      for (let wy = 180 - bh + 6; wy < 175; wy += 10) {
        for (let wx = x + 4; wx < x + bw - 4; wx += 8) {
          if (Math.random() > 0.4) {
            dist.fillRect(wx, wy, 2, 3);
          }
        }
      }
    }
    dist.setScrollFactor(0.15, 1);
    this.bgLayers.push({ graphics: dist });

    // Layer 2: Mid-range buildings (arcade — brown/tan brick)
    const mid = this.add.graphics();
    mid.fillStyle(0x8B7766, 1);
    mid.fillRect(0, 160, totalW, 80);
    for (let x = 0; x < totalW; x += 60 + Math.floor(Math.random() * 40)) {
      const bw = 50 + Math.floor(Math.random() * 40);
      const bh = 50 + Math.floor(Math.random() * 30);
      // Building body (brownish brick)
      mid.fillStyle(0x7A6655, 1);
      mid.fillRect(x, 240 - bh, bw, bh);
      mid.fillStyle(0x8B7766, 1);
      mid.fillRect(x + 2, 240 - bh, bw - 4, 3); // roof edge
      // Windows (dark with slight blue tint)
      mid.fillStyle(0x222244, 0.8);
      for (let wy = 240 - bh + 8; wy < 235; wy += 12) {
        for (let wx = x + 6; wx < x + bw - 6; wx += 12) {
          mid.fillRect(wx, wy, 6, 8);
          // Window frame
          mid.fillStyle(0x6A5A4A, 1);
          mid.fillRect(wx - 1, wy - 1, 8, 1);
          mid.fillRect(wx - 1, wy + 8, 8, 1);
          mid.fillStyle(0x222244, 0.8);
        }
      }
      // Door at bottom
      if (Math.random() > 0.4) {
        mid.fillStyle(0x3A2A1A, 1);
        mid.fillRect(x + bw / 2 - 5, 230, 10, 10);
        mid.fillStyle(0xAA8833, 1);
        mid.fillRect(x + bw / 2 + 3, 235, 1, 1);
      }
    }
    mid.setScrollFactor(0.30, 1);
    this.bgLayers.push({ graphics: mid });

    // Layer 3: Vertical fence/bars (arcade — teal/green metal bars)
    const fence = this.add.graphics();
    fence.fillStyle(0x334455, 1);
    fence.fillRect(0, 180, totalW, 80);
    // Horizontal bar strips (arcade-style blue/teal fence)
    fence.fillStyle(0x335566, 1);
    fence.fillRect(0, 182, totalW, 3);   // top rail
    fence.fillRect(0, 255, totalW, 3);   // bottom rail
    // Vertical bars (teal/green like arcade)
    for (let x = 0; x < totalW; x += 8) {
      fence.fillStyle(0x447766, 0.9);
      fence.fillRect(x, 185, 2, 70);
      // Alternate bar shade
      if (x % 16 === 0) {
        fence.fillStyle(0x558877, 0.7);
        fence.fillRect(x + 1, 185, 1, 70);
      }
    }
    // Street lamps on top of fence (like arcade)
    for (let x = 80; x < totalW; x += 200 + Math.floor(Math.random() * 100)) {
      fence.fillStyle(0x666666, 1);
      fence.fillRect(x, 170, 3, 15);     // lamp post
      fence.fillStyle(0xFFDD44, 0.8);
      fence.fillRect(x - 2, 168, 7, 4);  // lamp light
      fence.fillStyle(0xFFEE88, 0.3);
      fence.fillRect(x - 4, 165, 11, 3); // glow
    }
    fence.setScrollFactor(0.50, 1);
    this.bgLayers.push({ graphics: fence });

    // Layer 4: Stone walkway / building base (arcade — brick/stone wall)
    const stores = this.add.graphics();
    stores.fillStyle(0x7A6655, 1);
    stores.fillRect(0, 260, totalW, 100);
    // Brick pattern on wall
    for (let y = 262; y < 355; y += 8) {
      const xOff = ((y - 262) / 8 % 2) * 16;
      stores.fillStyle(0x6A5544, 1);
      stores.fillRect(0, y, totalW, 1); // horizontal mortar
      stores.fillStyle(0x6A5544, 0.6);
      for (let x = xOff; x < totalW; x += 32) {
        stores.fillRect(x, y, 1, 8); // vertical mortar
      }
    }
    // Blue/purple horizontal stripe accents (like arcade)
    stores.fillStyle(0x334466, 0.8);
    stores.fillRect(0, 300, totalW, 6);
    stores.fillRect(0, 320, totalW, 6);
    stores.fillRect(0, 340, totalW, 6);
    // Window details in wall
    for (let x = 20; x < totalW; x += 80 + Math.floor(Math.random() * 40)) {
      // Window
      stores.fillStyle(0xDDCC44, 0.6);
      stores.fillRect(x, 275, 4, 6);
      stores.fillRect(x + 30, 275, 4, 6);
    }
    // Ground detail strip
    stores.fillStyle(0x666666, 1);
    stores.fillRect(0, 355, totalW, 5);
    stores.setScrollFactor(0.75, 1);
    this.bgLayers.push({ graphics: stores });

    // Layer 5: Foreground — cross-hatch metal grating (arcade signature element)
    const gndDetail = this.add.graphics();
    gndDetail.fillStyle(0x888888, 1);
    gndDetail.fillRect(0, 370, totalW, 30);
    // Cross-hatch / diamond pattern (like arcade metal grate)
    for (let x = 0; x < totalW; x += 12) {
      for (let y = 370; y < 400; y += 12) {
        // Diamond pattern
        gndDetail.fillStyle(0x999999, 0.6);
        gndDetail.fillRect(x, y, 6, 1);
        gndDetail.fillRect(x + 6, y + 6, 6, 1);
        gndDetail.fillStyle(0x777777, 0.6);
        gndDetail.fillRect(x + 3, y + 3, 1, 6);
        gndDetail.fillRect(x + 9, y + 3, 1, 6);
      }
    }
    // Top edge line
    gndDetail.fillStyle(0xAAAAAA, 1);
    gndDetail.fillRect(0, 370, totalW, 2);
    gndDetail.setScrollFactor(0.90, 1);
    this.bgLayers.push({ graphics: gndDetail });

    // --- Ground ---
    this.groundGroup = this.physics.add.staticGroup();
    for (let x = 0; x < 4000; x += 64) {
      this.groundGroup.create(x + 32, GROUND_Y + 24, 'ground');
    }

    // --- Platforms (elevated areas) ---
    this.addPlatform(300, GROUND_Y - 80, 3);
    this.addPlatform(600, GROUND_Y - 60, 2);
    this.addPlatform(1000, GROUND_Y - 100, 4);
    this.addPlatform(1500, GROUND_Y - 70, 3);
    this.addPlatform(2000, GROUND_Y - 90, 5);
    this.addPlatform(2600, GROUND_Y - 80, 3);
    this.addPlatform(3200, GROUND_Y - 100, 4);

    // --- Hostages ---
    this.hostages = this.physics.add.group();
    const hostagePositions = [400, 900, 1400, 2200, 3000];
    for (const hx of hostagePositions) {
      const h = this.hostages.create(hx, GROUND_Y - 18, 'hostage');
      h.setImmovable(true);
      h.body.allowGravity = false;
      h.rescued = false;
      // Pulsing effect
      this.tweens.add({
        targets: h, alpha: 0.5, duration: 600, yoyo: true, repeat: -1
      });
    }

    // --- Player ---
    this.player = this.physics.add.sprite(100, GROUND_Y - 40, 'player');
    this.player.setCollideWorldBounds(true);
    this.player.body.setGravityY(GRAVITY);
    this.player.setDepth(10);
    this.physics.add.collider(this.player, this.groundGroup);

    // Camera follow
    this.cameras.main.startFollow(this.player, true, 0.1, 0.1);
    this.cameras.main.setDeadzone(100, 50);

    // --- Enemies group ---
    this.enemies = this.physics.add.group();
    this.projectiles = this.physics.add.group();

    // --- Collisions ---
    this.physics.add.collider(this.enemies, this.groundGroup);
    this.physics.add.overlap(this.player, this.hostages, this.rescueHostage, null, this);
    this.physics.add.overlap(this.player, this.enemies, this.playerHit, null, this);
    this.physics.add.overlap(this.player, this.projectiles, this.playerHitProjectile, null, this);

    // --- Input ---
    this.cursors = this.input.keyboard.createCursorKeys();
    this.keys = this.input.keyboard.addKeys({
      w: 'W', a: 'A', s: 'S', d: 'D',
      space: 'SPACE', f: 'F', enter: 'ENTER'
    });

    // --- Touch controls ---
    this.touchState = { left: false, right: false, jump: false, attack: false };
    if (this.isMobile) {
      this.createTouchControls();
    }

    // --- HUD (fixed to camera) ---
    this.createHUD();

    // --- Attack effect group ---
    this.attackFx = this.add.group();

    // --- Start message ---
    this.showMessage('STAGE 1 — RESCUE THE HOSTAGES', 2000);
  }

  checkMobile() {
    return /Android|iPhone|iPad|iPod|Opera Mini|IEMobile/i.test(navigator.userAgent)
      || (navigator.maxTouchPoints && navigator.maxTouchPoints > 1);
  }

  addPlatform(x, y, count) {
    for (let i = 0; i < count; i++) {
      const p = this.groundGroup.create(x + i * 64, y + 24, 'ground');
      p.setScale(1, 0.5).refreshBody();
    }
  }

  // --- TOUCH CONTROLS ---
  createTouchControls() {
    const cam = this.cameras.main;

    // D-pad (left side)
    this.dpadBase = this.add.image(80, GAME_H - 80, 'dpad_base')
      .setScrollFactor(0).setDepth(100).setAlpha(0.5);
    this.dpadKnob = this.add.image(80, GAME_H - 80, 'dpad_knob')
      .setScrollFactor(0).setDepth(101);

    // Buttons (right side)
    this.btnJump = this.add.image(GAME_W - 60, GAME_H - 110, 'btn_jump')
      .setScrollFactor(0).setDepth(100).setAlpha(0.6);
    this.btnAttack = this.add.image(GAME_W - 120, GAME_H - 60, 'btn_attack')
      .setScrollFactor(0).setDepth(100).setAlpha(0.6);

    // Labels
    this.add.text(GAME_W - 60, GAME_H - 110, 'J', {
      fontSize: '14px', color: '#fff', fontFamily: 'monospace'
    }).setOrigin(0.5).setScrollFactor(0).setDepth(102);
    this.add.text(GAME_W - 120, GAME_H - 60, 'A', {
      fontSize: '14px', color: '#fff', fontFamily: 'monospace'
    }).setOrigin(0.5).setScrollFactor(0).setDepth(102);

    // Touch handling
    this.input.on('pointerdown', (pointer) => this.handleTouch(pointer, true));
    this.input.on('pointermove', (pointer) => { if (pointer.isDown) this.handleTouch(pointer, true); });
    this.input.on('pointerup', (pointer) => this.handleTouchUp(pointer));

    // Multi-touch
    this.input.addPointer(2); // support up to 3 pointers
  }

  handleTouch(pointer, isDown) {
    const x = pointer.x;
    const y = pointer.y;

    // Left half = movement
    if (x < GAME_W / 2) {
      const dx = x - 80;
      const dy = y - (GAME_H - 80);
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 70) {
        this.touchState.left = dx < -15;
        this.touchState.right = dx > 15;
        // Knob visual
        const maxDist = 30;
        const clampDist = Math.min(dist, maxDist);
        const angle = Math.atan2(dy, dx);
        this.dpadKnob.x = 80 + Math.cos(angle) * clampDist;
        this.dpadKnob.y = (GAME_H - 80) + Math.sin(angle) * clampDist;
      }
    }

    // Right half = buttons
    if (x > GAME_W / 2) {
      const jumpDist = Phaser.Math.Distance.Between(x, y, GAME_W - 60, GAME_H - 110);
      const atkDist = Phaser.Math.Distance.Between(x, y, GAME_W - 120, GAME_H - 60);

      if (jumpDist < 40) {
        this.touchState.jump = true;
        this.btnJump.setAlpha(1);
      }
      if (atkDist < 40) {
        this.touchState.attack = true;
        this.btnAttack.setAlpha(1);
      }
    }
  }

  handleTouchUp(pointer) {
    const x = pointer.x;
    if (x < GAME_W / 2) {
      this.touchState.left = false;
      this.touchState.right = false;
      if (this.dpadKnob) {
        this.dpadKnob.x = 80;
        this.dpadKnob.y = GAME_H - 80;
      }
    } else {
      this.touchState.jump = false;
      this.touchState.attack = false;
      if (this.btnJump) this.btnJump.setAlpha(0.6);
      if (this.btnAttack) this.btnAttack.setAlpha(0.6);
    }
  }

  // --- HUD ---
  createHUD() {
    const style = { fontSize: '16px', fontFamily: '"Press Start 2P", monospace', color: '#ffffff' };
    const smallStyle = { ...style, fontSize: '10px' };

    // HUD background bar (arcade-style black bar)
    const hudBg = this.add.graphics().setScrollFactor(0).setDepth(50);
    hudBg.fillStyle(0x000000, 0.85);
    hudBg.fillRect(0, 0, GAME_W, 36);

    // Bottom bar
    hudBg.fillRect(0, GAME_H - 30, GAME_W, 30);

    // 1P + Lives (top-left, blue text like arcade)
    this.hudLives = this.add.text(10, 8, '1P  ♥♥♥', {
      ...style, color: '#4488FF'
    }).setScrollFactor(0).setDepth(51);

    // Score (top-left after 1P, white numbers like arcade)
    this.hudScore = this.add.text(160, 8, '000000', style)
      .setScrollFactor(0).setDepth(51);

    // Hi-Score (top-right, red "HI" + red numbers like arcade)
    this.hudHiScore = this.add.text(GAME_W - 10, 8, 'HI ' + String(this.hiScore).padStart(6, '0'), {
      ...style, color: '#FF2222'
    }).setOrigin(1, 0).setScrollFactor(0).setDepth(51);

    // Hostage icons (bottom-left, arcade "SAVE" in orange)
    this.add.text(10, GAME_H - 24, 'SAVE', { ...smallStyle, color: '#FFAA22' })
      .setScrollFactor(0).setDepth(51);
    this.hostageIcons = [];
    for (let i = 0; i < this.hostagesTotal; i++) {
      const icon = this.add.image(60 + i * 18, GAME_H - 16, 'hostage_icon_empty')
        .setScrollFactor(0).setDepth(51);
      this.hostageIcons.push(icon);
    }

    // Timer (bottom-right, arcade orange/yellow)
    this.hudTimer = this.add.text(GAME_W - 10, GAME_H - 24, this.formatTime(this.missionTime), {
      ...style, color: '#FFAA22', fontSize: '14px'
    }).setOrigin(1, 0).setScrollFactor(0).setDepth(51);

    // Enemy health bar (for bosses, hidden initially)
    this.bossBar = this.add.graphics().setScrollFactor(0).setDepth(52);
    this.bossBar.visible = false;
    this.bossName = this.add.text(GAME_W / 2, 42, '', {
      ...smallStyle, color: '#FF4444'
    }).setOrigin(0.5, 0).setScrollFactor(0).setDepth(52).setVisible(false);
  }

  formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return `${m}:${String(sec).padStart(2, '0')}`;
  }

  updateHUD() {
    this.hudLives.setText('1P  ' + '♥'.repeat(Math.max(0, this.lives)));
    this.hudScore.setText(String(this.score).padStart(6, '0'));
    this.hudTimer.setText(this.formatTime(Math.max(0, this.missionTime)));

    // Flash timer red when low
    if (this.missionTime < 30) {
      this.hudTimer.setColor(Math.floor(this.elapsed * 4) % 2 ? '#FF0000' : '#FF6666');
    }

    // Update hi-score
    if (this.score > this.hiScore) {
      this.hiScore = this.score;
      this.hudHiScore.setText('HI ' + String(this.hiScore).padStart(6, '0'));
    }

    // Boss health bar
    let boss = null;
    this.enemies.getChildren().forEach(e => {
      if (e.active && e.enemyType && (e.enemyType === 'mini_boss' || e.enemyType === 'final_boss')) {
        boss = e;
      }
    });
    if (boss) {
      const maxHp = ENEMY_TYPES[boss.enemyType].hp;
      const pct = boss.hp / maxHp;
      this.bossBar.clear();
      this.bossBar.visible = true;
      this.bossName.setVisible(true);
      this.bossName.setText(boss.enemyType === 'final_boss' ? 'SHOGUN' : 'ONI DEMON');
      // Bar background
      this.bossBar.fillStyle(0x333333, 0.8);
      this.bossBar.fillRect(GAME_W / 2 - 100, 56, 200, 10);
      // Bar fill
      this.bossBar.fillStyle(pct > 0.3 ? 0xFF0000 : 0xFF6600, 1);
      this.bossBar.fillRect(GAME_W / 2 - 100, 56, 200 * pct, 10);
    } else {
      this.bossBar.visible = false;
      this.bossName.setVisible(false);
    }
  }

  // --- SPAWN ---
  spawnEnemy(type, x) {
    const cfg = ENEMY_TYPES[type];
    if (!cfg) return;

    const spawnX = x || this.player.x + GAME_W / 2 + 50 + Math.random() * 100;
    const spawnY = GROUND_Y - cfg.h / 2;

    const enemy = this.enemies.create(spawnX, spawnY, 'enemy_' + type);
    enemy.body.setGravityY(GRAVITY);
    enemy.setCollideWorldBounds(true);
    enemy.enemyType = type;
    enemy.hp = cfg.hp;
    enemy.maxHp = cfg.hp;
    enemy.moveSpeed = cfg.speed;
    enemy.scoreValue = cfg.score;
    enemy.setDepth(8);

    // Move toward player
    enemy.body.setVelocityX(-cfg.speed);

    // Jumpers jump periodically
    if (type === 'jumper') {
      this.time.addEvent({
        delay: 1200 + Math.random() * 800,
        loop: true,
        callback: () => {
          if (enemy.active && enemy.body.touching.down) {
            enemy.body.setVelocityY(-350);
          }
        }
      });
    }

    // Shuriken throwers shoot
    if (type === 'shuriken') {
      this.time.addEvent({
        delay: 1500 + Math.random() * 1000,
        loop: true,
        callback: () => {
          if (enemy.active) this.shootProjectile(enemy);
        }
      });
    }

    return enemy;
  }

  shootProjectile(enemy) {
    const proj = this.projectiles.create(enemy.x, enemy.y, 'shuriken_proj');
    proj.body.allowGravity = false;
    const dir = enemy.x > this.player.x ? -1 : 1;
    proj.body.setVelocityX(dir * 250);
    proj.setDepth(9);
    // Auto-destroy after 3s
    this.time.delayedCall(3000, () => { if (proj.active) proj.destroy(); });
  }

  // --- COMBAT ---
  playerAttack() {
    const now = this.time.now;
    if (now - this.lastAttackTime < ATTACK_COOLDOWN) return;
    this.lastAttackTime = now;

    // Visual attack effect
    const atkX = this.player.x + this.playerFacing * 30;
    const fx = this.add.sprite(atkX, this.player.y, 'player_attack')
      .setAlpha(0.6).setDepth(11);
    this.tweens.add({
      targets: fx, alpha: 0, scaleX: 1.5, scaleY: 1.5,
      duration: 200, onComplete: () => fx.destroy()
    });

    // Check hits
    this.enemies.getChildren().forEach(enemy => {
      if (!enemy.active) return;
      const dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, enemy.x, enemy.y);
      const dirToEnemy = enemy.x - this.player.x;
      // Only hit enemies in front of player
      if (dist < ATTACK_RANGE && dirToEnemy * this.playerFacing >= 0) {
        this.hitEnemy(enemy);
      }
    });
  }

  hitEnemy(enemy) {
    enemy.hp--;
    // Flash white
    enemy.setTintFill(0xFFFFFF);
    this.time.delayedCall(80, () => { if (enemy.active) enemy.clearTint(); });

    // Hit effect
    const hfx = this.add.sprite(enemy.x, enemy.y, 'hit_fx').setDepth(12);
    this.tweens.add({
      targets: hfx, alpha: 0, scaleX: 2, scaleY: 2,
      duration: 250, onComplete: () => hfx.destroy()
    });

    if (enemy.hp <= 0) {
      this.addScore(enemy.scoreValue);
      // Death effect — flash and fade
      enemy.body.setVelocity(0, -200);
      this.tweens.add({
        targets: enemy, alpha: 0, duration: 300,
        onComplete: () => enemy.destroy()
      });

      // Score popup
      const popup = this.add.text(enemy.x, enemy.y - 20,
        '+' + enemy.scoreValue,
        { fontSize: '12px', fontFamily: 'monospace', color: '#FFFF00' }
      ).setDepth(20);
      this.tweens.add({
        targets: popup, y: popup.y - 40, alpha: 0,
        duration: 800, onComplete: () => popup.destroy()
      });

      // Camera shake for bosses
      if (enemy.enemyType === 'mini_boss' || enemy.enemyType === 'final_boss') {
        this.cameras.main.shake(400, 0.02);
      }
    } else {
      // Knockback
      const kb = this.playerFacing * 100;
      enemy.body.setVelocityX(kb);
    }
  }

  playerHit(player, enemy) {
    if (this.gameOver || player.invulnerable) return;
    this.loseLife();
  }

  playerHitProjectile(player, proj) {
    if (this.gameOver || player.invulnerable) return;
    proj.destroy();
    this.loseLife();
  }

  loseLife() {
    this.lives--;
    this.player.invulnerable = true;

    // Flash player
    this.tweens.add({
      targets: this.player,
      alpha: 0.3, duration: 100, yoyo: true, repeat: 10,
      onComplete: () => {
        this.player.setAlpha(1);
        this.player.invulnerable = false;
      }
    });

    this.cameras.main.shake(200, 0.015);

    if (this.lives <= 0) {
      this.endGame(false);
    }
  }

  rescueHostage(player, hostage) {
    if (hostage.rescued) return;
    hostage.rescued = true;
    this.hostagesRescued++;

    // Update icon
    if (this.hostagesRescued <= this.hostageIcons.length) {
      this.hostageIcons[this.hostagesRescued - 1].setTexture('hostage_icon');
    }

    // Score
    this.addScore(500);

    // Effect
    this.tweens.add({
      targets: hostage, y: hostage.y - 60, alpha: 0,
      duration: 600, onComplete: () => hostage.destroy()
    });

    // Flash message
    this.showMessage('HOSTAGE RESCUED!  +500', 1500);

    // Check win
    if (this.hostagesRescued >= this.hostagesTotal) {
      this.time.delayedCall(1000, () => this.endGame(true));
    }
  }

  addScore(pts) {
    this.score += pts;
  }

  showMessage(text, duration) {
    const msg = this.add.text(GAME_W / 2, GAME_H / 2 - 30, text, {
      fontSize: '18px', fontFamily: '"Press Start 2P", monospace',
      color: '#FFD700', stroke: '#000000', strokeThickness: 3
    }).setOrigin(0.5).setScrollFactor(0).setDepth(60);

    this.tweens.add({
      targets: msg, alpha: 0, y: msg.y - 20,
      delay: duration - 400, duration: 400,
      onComplete: () => msg.destroy()
    });
  }

  endGame(won) {
    this.gameOver = true;
    this.gameWon = won;

    // Save hi-score
    if (this.score > this.hiScore) {
      try { localStorage.setItem('shinobi_hi', String(this.score)); } catch(e) {}
    }

    // Overlay
    const overlay = this.add.graphics().setScrollFactor(0).setDepth(80);
    overlay.fillStyle(0x000000, 0.7);
    overlay.fillRect(0, 0, GAME_W, GAME_H);

    const title = won ? 'MISSION COMPLETE!' : 'GAME OVER';
    const titleColor = won ? '#FFD700' : '#FF0000';

    this.add.text(GAME_W / 2, GAME_H / 2 - 50, title, {
      fontSize: '28px', fontFamily: '"Press Start 2P", monospace',
      color: titleColor, stroke: '#000', strokeThickness: 4
    }).setOrigin(0.5).setScrollFactor(0).setDepth(81);

    this.add.text(GAME_W / 2, GAME_H / 2 + 10,
      `SCORE: ${this.score}    HOSTAGES: ${this.hostagesRescued}/${this.hostagesTotal}`, {
      fontSize: '12px', fontFamily: 'monospace', color: '#FFFFFF'
    }).setOrigin(0.5).setScrollFactor(0).setDepth(81);

    const restartText = this.isMobile ? 'TAP TO RESTART' : 'PRESS ENTER TO RESTART';
    const restart = this.add.text(GAME_W / 2, GAME_H / 2 + 60, restartText, {
      fontSize: '14px', fontFamily: 'monospace', color: '#AAAAAA'
    }).setOrigin(0.5).setScrollFactor(0).setDepth(81);

    this.tweens.add({
      targets: restart, alpha: 0.3, duration: 500, yoyo: true, repeat: -1
    });
  }

  // --- UPDATE LOOP ---
  update(time, delta) {
    if (this.gameOver) {
      if (this.keys.enter.isDown || (this.isMobile && this.input.activePointer.isDown)) {
        this.scene.restart();
      }
      return;
    }

    const dt = delta / 1000;
    this.elapsed += dt;
    this.missionTime -= dt;

    if (this.missionTime <= 0) {
      this.endGame(false);
      return;
    }

    // --- Player movement ---
    const onGround = this.player.body.touching.down || this.player.body.blocked.down;
    let moveX = 0;

    const left = this.cursors.left.isDown || this.keys.a.isDown || this.touchState.left;
    const right = this.cursors.right.isDown || this.keys.d.isDown || this.touchState.right;
    const jumpPress = Phaser.Input.Keyboard.JustDown(this.cursors.up)
      || Phaser.Input.Keyboard.JustDown(this.keys.w)
      || Phaser.Input.Keyboard.JustDown(this.keys.space)
      || this.touchState.jump;
    const attackPress = Phaser.Input.Keyboard.JustDown(this.keys.f) || this.touchState.attack;

    if (left) {
      moveX = -PLAYER_SPEED;
      this.playerFacing = -1;
      this.player.setFlipX(true);
    } else if (right) {
      moveX = PLAYER_SPEED;
      this.playerFacing = 1;
      this.player.setFlipX(false);
    }

    this.player.body.setVelocityX(moveX);

    if (jumpPress && onGround) {
      this.player.body.setVelocityY(PLAYER_JUMP);
    }

    if (attackPress) {
      this.playerAttack();
    }

    // --- Enemy AI ---
    this.enemies.getChildren().forEach(enemy => {
      if (!enemy.active) return;

      // Face player
      if (enemy.x > this.player.x) {
        enemy.setFlipX(false);
        enemy.body.setVelocityX(-enemy.moveSpeed);
      } else {
        enemy.setFlipX(true);
        enemy.body.setVelocityX(enemy.moveSpeed);
      }

      // Remove if too far off screen
      if (Math.abs(enemy.x - this.player.x) > GAME_W * 1.5) {
        enemy.destroy();
      }
    });

    // --- Spawn timeline ---
    while (this.spawnIndex < SPAWN_TIMELINE.length &&
           this.elapsed >= SPAWN_TIMELINE[this.spawnIndex].t) {
      const ev = SPAWN_TIMELINE[this.spawnIndex];
      for (let i = 0; i < ev.count; i++) {
        const side = Math.random() > 0.3 ? 1 : -1; // mostly from right
        const sx = this.player.x + side * (GAME_W / 2 + 50 + i * 60);
        this.spawnEnemy(ev.type, sx);
      }
      this.spawnIndex++;
    }

    // --- Continuous spawning after timeline ends ---
    if (this.spawnIndex >= SPAWN_TIMELINE.length && Math.random() < 0.003) {
      const types = ['ninja_runner', 'ninja_runner', 'jumper', 'shuriken', 'samurai'];
      this.spawnEnemy(types[Math.floor(Math.random() * types.length)]);
    }

    // --- Update HUD ---
    this.updateHUD();

    // Reset single-frame touch states
    if (this.isMobile) {
      this.touchState.jump = false;
      this.touchState.attack = false;
    }
  }
}

// ============================================================
// PHASER CONFIG
// ============================================================
const config = {
  type: Phaser.AUTO,
  width: GAME_W,
  height: GAME_H,
  parent: 'game-container',
  backgroundColor: '#1a1a2e',
  physics: {
    default: 'arcade',
    arcade: {
      gravity: { y: 0 },
      debug: false
    }
  },
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  scene: [BootScene, GameScene],
  input: {
    activePointers: 3
  },
  render: {
    pixelArt: true,
    antialias: false
  }
};

// Load pixel font
const fontLink = document.createElement('link');
fontLink.href = 'https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap';
fontLink.rel = 'stylesheet';
document.head.appendChild(fontLink);

// Wait for font then start
document.fonts.ready.then(() => {
  new Phaser.Game(config);
});
</script>
